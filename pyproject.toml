[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "auto-soc"
version = "0.1.0"
description = "Production-Grade Autonomous Cyber Incident Response & SOC Co-Pilot"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # --- Web Framework & API ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",           # Server-Sent Events (SSE) streaming

    # --- Auth & Security ---
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # --- gRPC & Protobuf ---
    "grpcio>=1.64.0",
    "grpcio-tools>=1.64.0",
    "protobuf>=5.27.0",

    # --- LLM Orchestration ---
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "openai>=1.40.0",

    # --- Vector Database ---
    "qdrant-client>=1.10.0",
    "fastembed>=0.3.0",               # Dense + sparse embeddings (ONNX, no GPU required)

    # --- Message Queue ---
    "aio-pika>=9.4.0",               # Async RabbitMQ client

    # --- Redis ---
    "redis[hiredis]>=5.0.0",         # Async Redis client + hiredis C parser (fast)
    "langgraph-checkpoint-redis>=0.1.0",  # AsyncRedisSaver LangGraph checkpointer

    # --- Guardrails ---
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "transformers>=4.42.0",           # DeBERTa prompt injection classifier
    "torch>=2.3.0",

    # --- RAG & Reranking ---
    "flashrank>=0.2.9",              # Cross-encoder reranker (CPU-friendly)

    # --- Observability ---
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "arize-phoenix-otel>=0.5.0",

    # --- Evaluation ---
    "deepeval>=1.4.0",

    # --- Config & Utilities ---
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.4.0",               # Retry logic with exponential backoff
    "structlog>=24.2.0",             # Structured JSON logging
    "rich>=13.7.0",                  # Pretty terminal output
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",                 # For FastAPI test client
    "factory-boy>=3.3.0",
    "faker>=25.8.0",
]

# ==============================================================================
# Tool Configurations
# ==============================================================================

[tool.ruff]
target-version = "py311"
line-length = 100
fix = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--tb=short -q --cov=src --cov-report=term-missing"

[tool.setuptools.packages.find]
where = ["src"]
